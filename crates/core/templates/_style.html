<style>
:root {
  --bg: #fafaf8; --fg: #1d1d1f; --muted: #6b6b70; --line: #e4e4e0; --card: #ffffff;
  --owned: #2f7d4f; --uncertain: #b26b00; --missing: #b3261e; --accent: #3558c7;
  --chip: #f0f0ec;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618; --fg: #ececec; --muted: #9a9aa0; --line: #2c2c30; --card: #1e1e21;
    --owned: #5cc28a; --uncertain: #e9a23b; --missing: #ef6b61; --accent: #8aa4ff;
    --chip: #2a2a2e;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
header h1 { margin: 0 0 4px; font-size: 24px; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.totals { display: flex; gap: 12px; flex-wrap: wrap; margin: 18px 0 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 120px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.stat.owned b { color: var(--owned); } .stat.uncertain b { color: var(--uncertain); } .stat.missing b { color: var(--missing); }
nav.toc { margin: 20px 0 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
nav.toc a { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--fg); }
nav.toc a:hover { border-color: var(--accent); text-decoration: none; }
.bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--chip); margin-top: 6px; }
.bar i { display: block; }
.bar .o { background: var(--owned); } .bar .u { background: var(--uncertain); } .bar .m { background: var(--missing); }
.counts { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
section.pl { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 24px; }
section.pl h2 { margin: 0 0 2px; font-size: 19px; }
.tabs { display: flex; gap: 6px; margin: 14px 0 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { font: inherit; background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .n { font-variant-numeric: tabular-nums; margin-left: 4px; }
.panel[hidden] { display: none; }
.album { border-top: 1px solid var(--line); padding: 12px 0; }
.album:first-child { border-top: 0; padding-top: 0; }
.album h3 { margin: 0; font-size: 15px; }
.album h3 small { color: var(--muted); font-weight: normal; }
.links { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.links a { font-size: 12px; background: var(--chip); border-radius: 999px; padding: 2px 9px; }
.album ol { margin: 8px 0 0; padding-left: 22px; }
.album li { padding: 3px 0; }
.meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; vertical-align: top; padding: 7px 8px; border-top: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; border-top: 0; }
td.num { color: var(--muted); font-variant-numeric: tabular-nums; width: 1%; }
.path { font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); word-break: break-all; }
.badge { display: inline-block; font-size: 11px; border-radius: 4px; padding: 1px 6px; background: var(--chip); font-variant-numeric: tabular-nums; }
.badge.isrc { color: var(--owned); }
.badge.warn { color: var(--uncertain); }
.empty { color: var(--muted); font-style: italic; padding: 8px 0; }
.scroll { overflow-x: auto; }
tr.snip td { border-top: 0; padding-top: 0; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.snips { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; margin-top: 6px; }
.snips b { font-size: 12px; }
.snips pre { margin: 4px 0 0; padding: 8px; background: var(--chip); border-radius: 6px; font-size: 11px; white-space: pre-wrap; word-break: break-all; user-select: all; }
@media (max-width: 640px) { .hide-sm { display: none; } }
.back { display: inline-block; margin-bottom: 14px; font-size: 13px; }
table.lists td.n { font-variant-numeric: tabular-nums; text-align: right; width: 1%; white-space: nowrap; }
table.lists td .bar { width: 120px; }
h2.sec { font-size: 17px; margin: 28px 0 8px; }
</style>
